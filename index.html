<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodHub | Food Delivery Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">FoodHub</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="menu.html">Our Menu</a>
            <a href="checkout.html">Checkout</a>
        </div>
    </nav>

    <header class="hero" style="background: linear-gradient(135deg, #ffe4e6 0%, #fecdd3 100%);">
        <div class="hero-content">
            <h1 style="color: #be123c;">Delicious Food, Delivered Fast.</h1>
            <p>Order your favorite meals from the best local restaurants.</p>
            <div class="cta-buttons">
                <a href="menu.html" class="btn btn-primary" style="background: #e11d48;">Browse Menu</a>
                <a href="checkout.html" class="btn btn-secondary" style="color: #e11d48; border-color: #e11d48;">Order Now</a>
            </div>
        </div>
    </header>

    <section class="categories">
        <h2>Popular Categories</h2>
        <div class="category-grid">
            <div class="category-card">Pizza</div>
            <div class="category-card">Burgers</div>
            <div class="category-card">Sushi</div>
            <div class="category-card">Desserts</div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 FoodHub. All rights reserved.</p>
    </footer>

</html>

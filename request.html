<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Custom Project | ProjectHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">ProjectHub</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="projects.html">Browse Projects</a>
            <a href="request.html">Request Custom</a>
        </div>
    </nav>
    <section class="categories" style="text-align:left; max-width:600px; margin:0 auto; padding-top:2rem;">
        <h2>Request a Custom Project</h2>
        <form style="display:flex; flex-direction:column; gap:1rem; margin-top:1.5rem; background:#fff; padding:2rem; border-radius:12px; box-shadow:0 4px 6px -1px rgb(0 0 0 / 0.1);">
            <label style="font-weight:600;">Course/Degree</label>
            <input type="text" placeholder="e.g. B.Tech Computer Science" style="padding:0.75rem; border:1px solid #ccc; border-radius:6px;">
            
            <label style="font-weight:600;">Project Requirements</label>
            <textarea rows="5" placeholder="Describe your idea..." style="padding:0.75rem; border:1px solid #ccc; border-radius:6px;"></textarea>
            
            <label style="font-weight:600;">Preferred Technologies</label>
            <input type="text" placeholder="e.g. React, Node.js, Python" style="padding:0.75rem; border:1px solid #ccc; border-radius:6px;">
            
            <label style="font-weight:600;">Budget</label>
            <input type="text" placeholder="Your budget in USD" style="padding:0.75rem; border:1px solid #ccc; border-radius:6px;">
            
            <button class="btn btn-primary" type="button" style="margin-top:1rem; border:none; cursor:pointer;">Request Project Quote</button>
        </form>
    </section>
</body>
</html>
